# Generated from PrusaSlicer 2.7.1 — modified for pen plotter use

[print:PlotterProfile]
# --- Geometry ---
layer_height = 0.1               # One layer only; Z lifts between strokes
first_layer_height = 0.1
perimeters = 1                   # Single-line strokes only
bottom_solid_layers = 0
top_solid_layers = 0
fill_density = 0%                # No infill — outlines only
fill_pattern = rectilinear

# --- Speed (pen plotters move slowly for clean lines) ---
perimeter_speed = 30
external_perimeter_speed = 30
infill_speed = 30
solid_infill_speed = 30
travel_speed = 60                # Faster travel with pen lifted
first_layer_speed = 20
gap_fill_speed = 20
small_perimeter_speed = 20

# --- Extrusion (disabled — no filament) ---
extrusion_width = 0.5            # Controls path spacing, not actual extrusion
external_perimeter_extrusion_width = 0.5
infill_extrusion_width = 0.5
first_layer_extrusion_width = 0.5
temperature = 0
first_layer_temperature = 0
bed_temperature = 0
first_layer_bed_temperature = 0

# --- No supports, brim, skirt ---
support_material = 0
support_material_auto = 0
brim_type = no_brim
brim_width = 0
skirts = 0
draft_shield = disabled

# --- Seam ---
seam_position = nearest           # Minimizes pen lifts

# --- Misc ---
thin_walls = 1
gap_fill_enabled = 0
avoid_crossing_perimeters = 1    # Reduces unnecessary pen lifts
only_retract_when_crossing_perimeters = 1
start_gcode = M1

[printer:PlotterPrinter]
printer_technology = FFF
gcode_flavor = reprap
nozzle_diameter = 0.5            # Treat as pen tip diameter
bed_shape = 0x0,300x0,300x210,0x210   # A4 landscape in mm — adjust to your plotter

# --- Z axis = pen lift ---
retract_lift = 40.0               # Lift pen 3mm between strokes
retract_lift_above = 0
retract_lift_below = 0
retract_length = 0               # No filament retraction
retract_speed = 40
retract_before_travel = 0.5      # Lift pen after 0.5mm travel gap

# --- Speed limits ---
machine_max_feedrate_x = 200,200
machine_max_feedrate_y = 200,200
machine_max_feedrate_z = 10,10
machine_max_acceleration_x = 500,500
machine_max_acceleration_y = 500,500
machine_max_acceleration_z = 100,100

# --- G-code ---
start_gcode = M280 P0 S160\nM280 P0 S10\nG4 P100\nM280 P0 S90\nG4 P100 ; BLTouch reset, deploy, stow\nG90\nG28\nG1 Z5 F300 ; lift pen clear of paper\nG1 X0 Y0 F3000 ; move to origin\nG1 Z0 F300 ; lower pen to paper
end_gcode = G1 Z10 F300 ; lift pen\nG1 X0 Y0 F3000 ; return home\nM84 ; disable motors
before_layer_gcode =             # Blank — single layer plot
layer_gcode =

# --- Disable extrusion-related features ---
use_firmware_retraction = 0
use_relative_e_distances = 1
use_volumetric_e = 0
wipe = 0

[filament:PlotterDummy]
# Dummy filament — extrusion multiplier zeroed out
filament_type = PLA
filament_diameter = 1.75
extrusion_multiplier = 0         # No actual extrusion
temperature = 0
first_layer_temperature = 0
filament_start_gcode = 
bed_temperature = 0
first_layer_bed_temperature = 0
cooling = 0
fan_always_on = 0
min_print_speed = 1
filament_end_gcode =                       # Nothing on end

[presets]
print = PlotterProfile
printer = PlotterPrinter
filament = PlotterDummy
